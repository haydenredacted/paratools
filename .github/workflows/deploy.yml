name: Deploy
on:
  push:
    branches: [master]
    paths: ['rndtool/**']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Generate rndData.js
        if: github.event_name != 'push'
        run: |
          php rndtool/gen-itemdata.php > rndtool/rndData.js
          sed -i -E "s#[0-9]{4}/[A-Za-z]+[0-9]{1,2}(st|nd|rd|th)#$(date +%Y/%B/%-d)#" rndtool/RDT.html
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add rndtool/rndData.js rndtool/RDT.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate rndData.js"
            git push
          fi

      - name: Deploy over SSH
        if: github.event_name == 'push'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=yes root@"$HOST" rndtool
